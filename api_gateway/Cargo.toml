[package]
name = "neos_api_gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
# Cloudflare Pingora - 고성능 프록시 프레임워크
pingora = "0.6"
pingora-core = "0.6"
pingora-proxy = "0.6"
pingora-http = "0.6"
pingora-load-balancing = "0.6"

# Async runtime
tokio = { version = "1.41", features = ["full"] }
async-trait = "0.1"

# Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# JWT 인증
jsonwebtoken = "9.3"

# 데이터베이스
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1", "with-chrono-0_4"] }
deadpool-postgres = "0.14"

# 암호화 (API 키 검증용)
bcrypt = "0.15"

# 유틸리티
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
once_cell = "1.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"
http = "1.1"
bytes = "1.8"
regex = "1.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
