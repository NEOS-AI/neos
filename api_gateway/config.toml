# API Gateway Configuration
# 이 파일은 Pingora 기반 API 게이트웨이의 설정을 담당합니다.
#
# 시크릿은 이 파일에 담지 않는다. 빈 값으로 두고 환경변수로 주입한다.
#
# 필수 시크릿 (required in production):
#   JWT_SECRET_KEY  - jwt.secret_key. 비어 있으면 게이트웨이가 기동을 거부한다.
#   DATABASE_URL    - [database] 전체를 대체한다.
#                     형식: postgres://user:password@host:port/db?sslmode=prefer
#
# 과도기 개별 오버라이드 (DATABASE_URL 미설정 시에만 적용):
#   DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
#
# 그 밖의 런타임 오버라이드:
#   GATEWAY_PORT   - server.listen_port
#   UPSTREAM_HOST  - upstream.host
#   UPSTREAM_PORT  - upstream.port
#   LOG_LEVEL      - logging.level
#   CONFIG_PATH    - 이 파일의 경로

[server]
# 게이트웨이 서버 설정
listen_addr = "0.0.0.0"
listen_port = 8080
# 워커 스레드 수 (0 = CPU 코어 수 자동 감지)
threads = 0
# 작업 큐 용량
work_stealing = true

[upstream]
# 백엔드 API 서버 설정
host = "127.0.0.1"
port = 8518
# 헬스체크 설정
health_check_interval_secs = 10
# 타임아웃 설정 (초)
connect_timeout_secs = 5
read_timeout_secs = 60
write_timeout_secs = 60
# 연결 풀 설정
pool_size = 100

[jwt]
# JWT 인증 설정
# secret_key는 반드시 환경변수 JWT_SECRET_KEY로 주입한다.
# 빈 값이면 빈 키로 서명된 토큰이 통과하므로 기동 시 검증에서 즉시 실패한다.
secret_key = ""
# 지원하는 알고리즘
algorithm = "HS256"
# 토큰 유효성 검사 여부
validate_exp = true
# 토큰 만료 허용 오차 (초)
leeway_secs = 60

[api_key]
# API 키 설정
prefix = "neos_"
# API 키 검증 시 bcrypt cost (기존 Python 백엔드와 일치해야 함)
bcrypt_cost = 12

[database]
# PostgreSQL 데이터베이스 설정
# DATABASE_URL이 있으면 이 블록 전체를 대체한다.
# 없으면 DB_HOST / DB_PORT / DB_NAME / DB_USER / DB_PASSWORD로 개별 오버라이드한다.
host = "localhost"
port = 5432
database = "neos"
username = "postgres"
# 비밀번호는 파일에 담지 않는다 — DATABASE_URL 또는 DB_PASSWORD로 주입한다.
password = ""
# 연결 풀 설정
pool_size = 10
# SSL 모드: disable, prefer, require
ssl_mode = "prefer"

[auth]
# 인증 관련 설정

# 인증을 건너뛸 경로 (정규식 패턴)
# 로그인, 회원가입, 헬스체크 등은 인증 없이 접근 가능
public_paths = [
    "^/api/v1/auth/login$",
    "^/api/v1/auth/register$",
    "^/api/v1/auth/refresh$",
    "^/health$",
    "^/health/ready$",
    "^/health/live$",
    "^/docs.*$",
    "^/openapi.json$",
    "^/redoc$",
]

# 헤더 이름 설정
user_id_header = "X-User-ID"
authorization_header = "Authorization"
api_key_header = "X-API-Key"

[rate_limit]
# 레이트 리미팅 설정 (향후 구현)
enabled = false
default_rpm = 100  # 분당 요청 수
burst_size = 20

[logging]
# 로깅 설정
level = "info"
# 로그 포맷: json, pretty
format = "pretty"
# 요청/응답 로깅
log_requests = true
log_responses = false

[cors]
# CORS 설정 (향후 구현)
enabled = true
allowed_origins = ["*"]
allowed_methods = ["GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS"]
allowed_headers = ["*"]
max_age_secs = 86400
