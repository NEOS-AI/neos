[project]
name = "neos-evals"
version = "0.1.0"
description = "Evaluation framework for NEOS Hyper Deep Research Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core framework
    "pydantic>=2.0",
    "pydantic-settings>=2.0",

    # Database
    "sqlalchemy>=2.0",
    "alembic>=1.12",

    # LLM APIs for model-based graders
    "anthropic>=0.18",

    # Analytics and utilities
    "pandas>=2.0",
    "plotly>=5.17",
    "rich>=13.5",
    "typer>=0.9",

    # Testing
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
]

[project.optional-dependencies]
dev = [
    "black>=26.3.1",
    "ruff>=0.1",
    "mypy>=1.5",
]

[project.scripts]
neos-eval = "neos_evals.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
