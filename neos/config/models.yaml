# 모델 카탈로그 — 모델 사실의 단일 원천
#
# 새 Claude/GPT 모델 추가는 이 파일 편집으로 끝난다.
# 배포 *정책*(provider × role 라우팅, 기능 오버라이드)은 여기가 아니라
# config/neos.*.yaml에 있다.
#
# 필드:
#   provider     anthropic | openai | gemini | ollama
#   tiers        추천 티어 목록 (fast|balanced|powerful). 비면 추천에 등장하지 않음
#   thinking     adaptive | budgeted | none  (미선언 시 budgeted)
#   selectable   list_models()에 노출되는가 (기본 true). Anthropic·OpenAI에만 파생 적용
#   pricing      USD / 1M 토큰. 없으면 "가격 미상" — 비용 집계 시 경고 후 0
#   vision       이미지·PDF 입력을 받는가 (기본 false). 유일한 독자는
#                supports_vision() — 첨부 게이트가 부른다.
#   mid_conversation_tools   대화 중간 tool_addition 으로 도구를 공개할 수 있는가
#                (기본 false). 유일한 독자는 supports_mid_conversation_tools() —
#                true 면 코딩 루프가 deferred 도구까지 tools[] 에 항상 선언하고
#                공개는 메시지로 알린다. false 면 예전처럼 배열에서 걸러낸다.
#   mid_conversation_system  대화 중간 role:"system" 메시지를 받는가 (기본 false).
#                유일한 독자는 supports_mid_conversation_system() — 코딩 Anthropic
#                어댑터가 system 노트를 네이티브로 보낼지 텍스트로 보낼지 정한다.
#   effort_levels  이 모델이 받는 **사고량** 레벨 (Anthropic `output_config.effort`).
#                low|medium|high|xhigh|max 중에서 — 목록은 SDK 가 정한다.
#                DA 의 Effort(scout/dig/synth, 조사 깊이)와 **다른 축**이다.
#                비면 "모른다" 이고 아무것도 보내지 않는다. 지원 여부를 말하는
#                것은 models API 의 ModelCapabilities.effort 이므로 키 없이
#                채우지 않는다 — 추측한 레벨은 미지원 모델에서 매 요청 400 이고,
#                맞더라도 재 본 적 없는 사고량으로 도는 것이다. 프로바이더별
#                어휘(EFFORT_VOCABULARY) 안에서만. 근거는 tests/config/test_model_effort.py.
#   role_alias   role_aliases: 키. advisor family 가 아니다
#   gateway_id   피커/쿠키 id. provider/키 로 추론하지 않는다
#   picker       채팅 피커 노출. 없으면 selectable 이어도 피커에 안 오른다
#   wire_id      프로바이더에 보내는 id. 기본은 카탈로그 키
#   id_forms     추가로 받는 철자. 날짜 접미사를 지어내지 않는다
#   aux          헬퍼 슬롯(fast|title|artifact) → 카탈로그 핀
#   context_window  전체 창. 없으면 compact 는 80k 폴백 (요청 형태는 유지)
#   input_limit     선택. 있으면 usable 의 출발점 (window − max_out 대신)
#   thinking_budgets  선택 {default, max, ...}. usable 에서 default 를 뺀다
#
# 선언 순서가 list_models() 순서다. 최신 → 레거시 순을 유지할 것.

models:
  # ---- Anthropic (선택 가능) ----
  claude-sonnet-5:
    provider: anthropic
    tiers: [balanced]
    thinking: adaptive
    # models API 실호출 (2026-09-24, scripts/probe_anthropic_effort.py)
    effort_levels: [low, medium, high, xhigh, max]
    description: "Anthropic Claude Sonnet 5"
    max_tokens: 8192
    context_window: 200000
    vision: true
    role_alias: sonnet-5
    gateway_id: anthropic/claude-sonnet-5
    picker:
      name: "Claude Sonnet 5"
      description: "Best balance of speed, intelligence, and cost"
      group: anthropic
    pricing: {input: 3.00, output: 15.00, cache_creation: 3.75, cache_read: 0.30}

  # Claude Opus 5.5 (2026-09-24). claude-opus-5 를 대체한다. 사실의 출처는
  # Anthropic claude-api 레퍼런스의 "Migrating to Claude Opus 5.5" 절이고,
  # 가격·gateway id 는 Vercel AI Gateway `/v1/models` 와 대조했다:
  # 1M 창 · 최대 출력 128K · $4/$20 · 5분 캐시 쓰기 $5.00 · 캐시 읽기 $0.20.
  # ⚠️ thinking 을 끌 수 없다 -- `{type: "disabled"}` 는 모든 effort 에서 400
  # (`thinking_always_on`). 강제 tool_choice(any/tool)도 400 이다.
  claude-opus-5-5:
    provider: anthropic
    tiers: [powerful]
    thinking: adaptive
    # models API 실호출 (2026-09-24, scripts/probe_anthropic_effort.py)
    effort_levels: [low, medium, high, xhigh, max]
    thinking_always_on: true
    description: "Anthropic Claude Opus 5.5"
    max_tokens: 8192
    context_window: 1000000
    vision: true
    mid_conversation_system: true
    role_alias: opus-5.5
    gateway_id: anthropic/claude-opus-5.5
    picker:
      name: "Claude Opus 5.5"
      description: "Most capable Anthropic model"
      group: anthropic
    pricing: {input: 4.00, output: 20.00, cache_creation: 5.00, cache_read: 0.20}

  # Claude Fable 5.1 (K0, 2026-09-15). 사실의 출처는 Anthropic claude-api 레퍼런스의
  # "Migrating to Claude Fable 5.1" 절이다: 1M 창(기본=최대) · 최대 출력 128K ·
  # thinking 항상 켜짐(adaptive 외 설정은 400) · $10/$50 · 5분 캐시 쓰기 $12.50 ·
  # 캐시 읽기 $0.25(0.025x) · 대화 중간 system 메시지 지원. 피커에 올리지 않는다 —
  # 기능 오버라이드로만 쓴다.
  # ⚠️ 강제 tool_choice(any/tool)를 400 으로 거절한다. thinking 블록은 만든 대화의
  # 앞부분에 묶인다 — 이력을 고치면 400 이다(코딩 루프 `_guard_thinking_prefix`).
  claude-fable-5-1:
    provider: anthropic
    selectable: false
    thinking: adaptive
    # models API 실호출 (2026-09-24, scripts/probe_anthropic_effort.py)
    effort_levels: [low, medium, high, xhigh, max]
    thinking_always_on: true
    description: "Anthropic Claude Fable 5.1"
    max_tokens: 128000
    context_window: 1000000
    vision: true
    mid_conversation_system: true
    # K2b. 이 트랙이 겨누는 모델이라 여기에만 켠다. 다른 모델이 받는지는
    # 로컬에서 확인할 수 없으므로 켜지 않는다 -- 꺼져 있으면 배열에서
    # 걸러내는 옛 경로가 그대로 맞다.
    mid_conversation_tools: true
    # K4b (2026-09-24 실측). 보내지 않으면 thinking 본문이 **빈다**(서버 기본 omitted)
    # -- K4a 상태 줄이 이 모델에서 죽어 있었다. 스펙 R-04 대로 updates 를 받는다.
    thinking_display: updates
    pricing: {input: 10.00, output: 50.00, cache_creation: 12.50, cache_read: 0.25}

  # 심층분석 판정자 전용 (E3, 2026-08-30). 피커에 올리지 않으므로 tiers 없이
  # `selectable: false` 다 -- `deep_analysis.models.judge` 기능 오버라이드로만
  # 쓰인다. 카탈로그에 넣는 이유는 §6 ③ 하나다: 등재하지 않으면 가격을 못 찾아
  # 판정자 비용이 조용히 0 으로 집계된다.
  #
  # `thinking: adaptive` 는 **추측이 아니라 실측이다** (2026-08-30). 실제 호출로
  # 두 형태를 다 재 봤다 -- `temperature` 를 실으면
  # `400 invalid_request_error: temperature is deprecated for this model` 이고,
  # `thinking={"type":"adaptive"}` 로 보내면 정상 응답한다. 이 값이 틀리면
  # `normalize_anthropic_request` 가 잘못된 페이로드를 만들어 판정자가 전부
  # 실패한다(그 경로가 실제로 쓰인다 -- `deep_analysis/llm.py:190`).
  #
  # ⚠️ **가격은 미검증이다.** 저장소 안의 유일한 출처가 `codex/anthropic-caching-advisor`
  # 브랜치이고 그 값은 opus-5 와 **정확히 같다**(복붙일 수도 있다). 같은 브랜치의
  # haiku 가격은 카탈로그와 어긋났다. 공식 요율로 대조해 고칠 것 -- 등재돼 있으므로
  # `neos_llm_unpriced_calls_total` 은 울리지 않는다. 즉 **틀려도 조용하다.**
  claude-opus-4-8:
    provider: anthropic
    selectable: false
    thinking: adaptive
    # models API 실호출 (2026-09-24, scripts/probe_anthropic_effort.py)
    effort_levels: [low, medium, high, xhigh, max]
    description: "Anthropic Claude Opus 4.8 (deep-analysis judge)"
    max_tokens: 8192
    context_window: 200000
    vision: true
    mid_conversation_system: true
    pricing: {input: 5.00, output: 25.00, cache_creation: 6.25, cache_read: 0.50}

  claude-haiku-4-5-20251001:
    provider: anthropic
    tiers: [fast]
    thinking: budgeted
    description: "Anthropic Claude Haiku 4.5"
    max_tokens: 8192
    context_window: 200000
    vision: true
    role_alias: haiku-4.5
    gateway_id: anthropic/claude-haiku-4.5
    id_forms: [claude-haiku-4-5, claude-haiku-4.5]
    picker:
      name: "Claude Haiku 4.5"
      description: "Fast and affordable, great for everyday tasks"
      group: anthropic
    pricing: {input: 0.25, output: 1.25, cache_creation: 0.30, cache_read: 0.03}

  claude-sonnet-4-5-20250929:
    provider: anthropic
    thinking: budgeted
    context_window: 200000
    vision: true
    gateway_id: anthropic/claude-sonnet-4.5
    id_forms: [claude-sonnet-4-5, claude-sonnet-4.5]
    picker:
      name: "Claude Sonnet 4.5"
      description: "Previous-generation balanced model"
      group: anthropic
      extras:
        - gateway_id: anthropic/claude-sonnet-4.5-thinking
          name: "Claude Sonnet 4.5 (Thinking)"
          description: "Extended thinking for complex problems"
          group: reasoning
    pricing: {input: 3.00, output: 15.00, cache_creation: 3.75, cache_read: 0.30}

  # claude-opus-5 는 은퇴했다 (2026-09-24). claude-opus-5-5 가 대신한다 --
  # 옛 쿠키·핀·역할 별칭은 아래 remaps 가 받는다.

  # claude-sonnet-4-6 / claude-opus-4-6은 은퇴했다. 가격을 모르는 채로
  # 선택 가능해서 비용이 0으로 집계됐다. 각각 claude-sonnet-5 / claude-opus-5로
  # 대체한다.

  # ---- Anthropic (가격만 아는 레거시) ----
  claude-3-5-sonnet-20240620:
    provider: anthropic
    thinking: budgeted
    selectable: false
    context_window: 200000
    vision: true
    pricing: {input: 3.00, output: 15.00, cache_creation: 3.75, cache_read: 0.30}

  claude-opus-4-5-20251101:
    provider: anthropic
    thinking: budgeted
    selectable: false
    context_window: 200000
    vision: true
    pricing: {input: 15.00, output: 75.00, cache_creation: 18.75, cache_read: 1.50}

  # ---- OpenAI (선택 가능) ----
