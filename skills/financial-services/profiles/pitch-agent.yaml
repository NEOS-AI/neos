slug: pitch-agent
mode: A
isolation_surface: cma_leaves
artifact_surface:
  default: headless
tools:
  default: deny
  orchestrator_allow:
    - read_file.v1
    - search_text.v1
    - glob_files.v1
skill_allowlist:
  - dcf-model
  - lbo-model
  - xlsx-author
  - pptx-author
  - pitch-deck
mcp_allowlist: []
handoff_allowlist: []
leaves:
  - name: pitch-researcher
    catalog_template: fsi-puller
    write: false
    tools_allow:
      - read_file.v1
      - search_text.v1
    mcp_allowlist:
      - capiq
      - daloopa
    output_schema_ref: pitch-researcher
  - name: pitch-modeler
    catalog_template: fsi-modeler
    write: false
    tools_allow:
      - read_file.v1
      - search_text.v1
      - execute.v1
    mcp_allowlist:
      - capiq
      - daloopa
    output_schema_ref: null
  - name: pitch-deck-writer
    catalog_template: fsi-writer
    write: true
    tools_allow:
      - read_file.v1
      - write_file.v1
      - edit_file.v1
      - load_skill.v1
    mcp_allowlist: []
    output_schema_ref: null
