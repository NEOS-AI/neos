  orchestrator_allow:
    - read_file.v1
    - search_text.v1
    - glob_files.v1
skill_allowlist:
  - accrual-schedule
  - roll-forward
  - xlsx-author
mcp_allowlist: []
handoff_allowlist: []
leaves:
