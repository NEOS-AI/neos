slug: valuation-reviewer
mode: B
isolation_surface: cma_leaves
artifact_surface:
  default: headless
tools:
  default: deny
  orchestrator_allow:
    - read_file.v1
    - search_text.v1
    - glob_files.v1
skill_allowlist:
  - returns-analysis
  - xlsx-author
mcp_allowlist: []
handoff_allowlist: []
leaves:
  - name: valuation-package-reader
    catalog_template: fsi-reader
    write: false
    tools_allow:
      - read_file.v1
      - search_text.v1
    mcp_allowlist: []
    output_schema_ref: valuation-package-reader
  - name: valuation-runner
    catalog_template: fsi-critic
    write: false
    tools_allow:
      - read_file.v1
      - search_text.v1
    mcp_allowlist:
      - portfolio
    output_schema_ref: null
  - name: valuation-publisher
    catalog_template: fsi-writer
    write: true
    tools_allow:
      - read_file.v1
      - write_file.v1
      - edit_file.v1
      - load_skill.v1
    mcp_allowlist: []
    output_schema_ref: null
