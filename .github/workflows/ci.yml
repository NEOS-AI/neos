name: CI - Test and Build

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  # ========== Python Backend Tests ==========
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: neos_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: neos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio pytest-cov

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql+asyncpg://neos_test:test_password@localhost:5432/neos_test
          REDIS_URL: redis://localhost:6379/0
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-key' }}
          JWT_SECRET_KEY: test-secret-key-for-ci
        run: |
          pytest tests/ \
            --cov=neos \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            -v

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: backend
          name: backend-coverage

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v3
        with:
          name: backend-coverage
          path: htmlcov/

  # ========== Security Scanning ==========
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit

      - name: Check for security vulnerabilities (safety)
        run: |
          pip install -e .
          safety check --json || true

      - name: Run Bandit security scan
        run: |
          bandit -r neos/ -f json -o bandit-report.json || true
          bandit -r neos/ -f txt

      - name: Upload security reports
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: |
            bandit-report.json

  # ========== Code Quality ==========
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy

      - name: Check code formatting (black)
        run: |
          black --check neos/ tests/ || true

      - name: Check import ordering (isort)
        run: |
          isort --check-only neos/ tests/ || true

      - name: Lint with flake8
        run: |
          flake8 neos/ tests/ --max-line-length=120 --extend-ignore=E203,W503 || true

      - name: Type checking (mypy)
        run: |
          pip install -e .
          mypy neos/ --ignore-missing-imports || true

  # ========== Docker Build ==========
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-tests, security-scan]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: neos-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run --rm neos-backend:${{ github.sha }} python --version

  # ========== Integration Tests ==========
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - uses: actions/checkout@v4

      - name: Start services with Docker Compose
        run: |
          docker-compose -f docker-compose.enterprise.yml up -d postgres-primary redis-master
          sleep 10

      - name: Wait for services
        run: |
          timeout 60 bash -c 'until docker exec neos-postgres-primary pg_isready; do sleep 2; done'
          timeout 60 bash -c 'until docker exec neos-redis-master redis-cli ping; do sleep 2; done'

      - name: Run integration tests
        run: |
          echo "Integration tests would run here"
          # pytest tests/integration/ -v

      - name: Cleanup
        if: always()
        run: |
          docker-compose -f docker-compose.enterprise.yml down -v

  # ========== Build Summary ==========
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, security-scan, code-quality, docker-build]
    if: always()

    steps:
      - name: Check build status
        run: |
          echo "Build Summary:"
          echo "Backend Tests: ${{ needs.backend-tests.result }}"
          echo "Security Scan: ${{ needs.security-scan.result }}"
          echo "Code Quality: ${{ needs.code-quality.result }}"
          echo "Docker Build: ${{ needs.docker-build.result }}"

      - name: Fail if any job failed
        if: |
          needs.backend-tests.result == 'failure' ||
          needs.docker-build.result == 'failure'
        run: exit 1
