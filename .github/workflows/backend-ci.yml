name: Backend CI

on:
  pull_request:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql+asyncpg://neos:neos_password@localhost:5432/neos_db
  JWT_SECRET_KEY: neos-ci-only-secret-key-2026-07-19
  GOOGLE_API_KEY: neos-ci-placeholder
  # development 프로파일(NEOS_ENV 기본값)이 실제 코딩 루프를 켠다. 켜진 루프는
  # 기동 시 프로바이더 크리덴셜을 요구하므로(fail-closed) 자리표시자를 준다.
  # 테스트는 네트워크로 모델을 부르지 않는다.
  ANTHROPIC_API_KEY: neos-ci-placeholder
  DEBUG: "false"
  LITELLM_LOCAL_MODEL_COST_MAP: "True"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          version: "0.11.16"
      # --frozen 이 아니라 --locked 다. --frozen 은 "락파일을 갱신하지 마라"일
      # 뿐, 락이 pyproject.toml 과 맞는지는 검사하지 않는다. 2026-08-29 에 dev
      # 그룹의 pytest-timeout 이 pyproject.toml 에만 추가되고 uv.lock 에는 없는
      # 채로 머지됐다. 저자의 .venv 에는 그 패키지가 손으로 설치돼 있어 로컬은
      # 초록이었고, CI 는 어긋남을 "락 불일치"라고 말해주는 대신 엉뚱한 곳에서
      # 터졌다 -- tests/test_workflow_improvements_integration.py 수집 실패
      # ('timeout' not found in `markers`). 플러그인이 없으니 그 마커를 등록해줄
      # 주체가 없고 addopts 의 --strict-markers 가 거부한 것이다. --locked 는
      # 같은 상황을 원인의 이름 그대로, 테스트를 돌리기도 전에 실패시킨다.
      - run: uv sync --locked --group dev
      # YAML 과 커밋된 FE 폴백이 어긋나면 피커가 두 시계를 갖는다.
      # 스크립트가 to_picker_payload() 로 다시 쓰고, 커밋 파일이 같아야 한다.
      - name: Check catalog.generated.ts is not stale
        run: |
          uv run --frozen python scripts/generate_catalog_fallback.py
          git diff --exit-code -- web/lib/ai/catalog.generated.ts
      # 파일 나열이 아니라 디렉터리다. 예전 판은 네 파일만 검사했고, 그래서
      # 2026-08-13 에 `tests/config/test_test_environment_policy.py` 를 고치며
      # 남긴 미사용 임포트가 **린트 대상 안에 있었는데도** 그 파일만 통과시켜
      # 놓친 것이 아니라 -- 반대로, 그 좁은 목록에 없던 다른 파일들은 애초에
      # 검사된 적이 없다. 목록은 새 파일이 생길 때마다 조용히 낡는다.
      #
      # 저장소 전체는 아직 343건이 남아 있어 게이트로 세울 수 없다. 여기 적힌
      # 세 디렉터리는 **현재 0건**이며, 이 트랙이 실제로 작업하는 표면이다.
      # 나머지는 정리되는 대로 추가한다.
      # 새 마이그레이션을 더하고 BOOTSTRAP_ORDER.txt 에 적지 않으면, 그 파일은
      # 배포 DB 에서만 조용히 빠진다. 테스트는 안 걸린다 -- tests/conftest.py 는
      # 정본 순서가 아니라 ORM create_all() + 번호순으로 따로 스키마를 세우므로
      # 목록과 무관하게 초록이다. 2026-09-20 에 그 틈으로 `knowledge_graphs` 가
      # 발견됐다: 문서 파이프라인이 쓰는데 db/**/*.sql 중 만드는 파일이 없었고,
      # ORM 이 테스트에서만 대신 만들어 주고 있었다.
      #
      # 여기서는 목록 완전성만 본다(Docker 불필요). 전량 적용 검증은
      # neos-paradedb 이미지가 필요해 이 잡의 pgvector 서비스로는 돌릴 수 없고,
      # `make db-verify` 로 로컬·배포 전에 돈다.
      - name: Schema bootstrap list is complete
        run: uv run --frozen python scripts/verify_schema_bootstrap.py --check-list-only
      - name: Ruff
        run: >-
          uv run --frozen ruff check
          neos/workflow/deep_analysis
          tests/workflow/deep_analysis
          tests/config
          tests/conftest.py
      - name: Test CI environment policy
        run: uv run --frozen pytest tests/config/test_test_environment_policy.py -q
      - name: Collect backend tests
        run: uv run --frozen pytest --collect-only tests/workflow tests/api -q

  workflow-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: neos
          POSTGRES_PASSWORD: neos_password
          POSTGRES_DB: neos_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neos -d neos_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          version: "0.11.16"
      - run: uv sync --locked --group dev
      # db/init.sql 이 요구하는 확장 전부(vector + pg_trgm). 목록을 여기 적으면
      # 확장이 늘어날 때 낡으므로 스크립트가 그 파일에서 읽는다.
      - name: Enable database extensions
        run: uv run --frozen python scripts/enable_db_extensions.py
      - run: uv run --frozen pytest tests/workflow -q

  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: neos
          POSTGRES_PASSWORD: neos_password
          POSTGRES_DB: neos_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neos -d neos_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          version: "0.11.16"
      - run: uv sync --locked --group dev
      # db/init.sql 이 요구하는 확장 전부(vector + pg_trgm). 목록을 여기 적으면
      # 확장이 늘어날 때 낡으므로 스크립트가 그 파일에서 읽는다.
      - name: Enable database extensions
        run: uv run --frozen python scripts/enable_db_extensions.py
      - run: uv run --frozen pytest tests/api -q

  # tests/ 에서 위 두 잡이 안 도는 나머지 전부. 셋을 합치면 `pytest tests/`
  # 와 같은 집합이고, `test_ci_workflow_covers_every_test_file` 이 그 등식을
  # 강제한다.
  #
  # 이 잡이 없던 동안 CI 는 2,518건 중 1,192건(47%)만 돌았다 -- S5("전체
  # 스위트가 CI 에서 결정론적으로 통과한다")의 지배적 격차였고, 2026-08-12
  # 에 실측으로 드러났다. 빠져 있던 1,326건 중 3건은 `.env` 의 실제 API 키가
  # 있을 때만 통과하는 상태였다.
  rest-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: neos
          POSTGRES_PASSWORD: neos_password
          POSTGRES_DB: neos_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neos -d neos_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          version: "0.11.16"
      - run: uv sync --locked --group dev
      # db/init.sql 이 요구하는 확장 전부(vector + pg_trgm). 목록을 여기 적으면
      # 확장이 늘어날 때 낡으므로 스크립트가 그 파일에서 읽는다.
      - name: Enable database extensions
        run: uv run --frozen python scripts/enable_db_extensions.py
      - run: >-
          uv run --frozen pytest tests
          --ignore=tests/workflow --ignore=tests/api -q
