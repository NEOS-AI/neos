# (#6 judge_budget · #7 source_quality · #8 gate_definition · #9
# assembly_truncation · #12 budget_floor_formula · #16 subquestion_coverage)
# 중 아무 둘을 골라도 같은 총점(6.0)이 나온다 -- 그래서 최댓값 조합이
