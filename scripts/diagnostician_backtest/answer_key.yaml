# D53~D63 (DECISIONS.md) 을 직접 읽고 만든 정답키.
# truth = 최종 확립된 병목(나중 표본의 정정 포함).
# contemporaneous = 그 시점에 사람이 그 표본만 보고 내린 결론.
# 둘이 갈리는 것은 나중 표본이 그때의 읽기를 뒤집었을 때뿐이다.
#
# 각 항목은 DECISIONS.md 의 본문을 직접 열어 truth/contemporaneous 를
# 대조했다 (초안은 「다음」 절만 보고 뽑았었다). 대조 결과 여섯 항목 모두
# 본문과 일치해 값을 바꾸지 않았다. 특히 #13(D57)은 "원인을 확정하지
# 못했고, 그 이유가 관측 구멍이다" / "다음 수는 고치는 것이 아니라 재는
# 것이다" 로 당시엔 판별 불가(instrumentation)였음을 본문이 그대로 확인하고,
# 실제 병목(assembly_clamp)은 D59("병목은 순수하게 절삭이다")와
# D61("리포트 층이 맞다")이 확정한다.
