# D40~D63 (DECISIONS.md) 을 직접 읽고 만든 정답키.
# truth = 최종 확립된 병목(나중 표본의 정정 포함).
# contemporaneous = 그 시점에 사람이 그 표본만 보고 내린 결론.
# 둘이 갈리는 것은 나중 표본이 그때의 읽기를 뒤집었을 때뿐이다.
#
# 각 항목은 DECISIONS.md 의 본문을 직접 열어 truth/contemporaneous 를
# 대조했다 (초안은 「다음」 절만 보고 뽑았었다). #11~#16 만으로는 게이트를
# 두 번 미달했고(D79·D81), 그 여섯 표본에 대고 진단자(프롬프트)를 계속
# 재조정하는 것은 정답을 정답키에 맞추는 오염이라 판단해, #6~#10 을 더해
# 표본창을 넓혔다 (`docs/DEEP_ANALYSIS_HARNESS_ROADMAP.md` F2·D-11 참조).
#
# 특히 #13(D57)은 "원인을 확정하지 못했고, 그 이유가 관측 구멍이다" /
# "다음 수는 고치는 것이 아니라 재는 것이다" 로 당시엔 판별 불가
# (instrumentation)였음을 본문이 그대로 확인하고, 실제 병목(assembly_clamp)은
# D59("병목은 순수하게 절삭이다")와 D61("리포트 층이 맞다")이 확정한다.
#
# #6~#10 에서 새로 찾은 정정 둘:
# - #9(D48) 는 "조립이 예산 부족으로 열화한다"(budget_floor_formula)로
#   읽었지만, D50 이 같은 표본의 판정자 반려를 다시 읽고 "절단은 예산이
#   아니라 상한 때문이다"로 뒤집는다 -- truth 는 assembly_truncation.
# - #10(D51) 은 "재시도가 처음으로 교정에 성공했다"며 "리포트 층에서 할 일은
#   거의 끝났다"(남은 것은 source_quality/subquestion_coverage 뿐)로 읽었으나,
#   D51 자신의 경고문과 D53(표본 #11)이 그 결론 자체가 틀렸다고 정정한다 --
#   시도 1 은 LLM 조립을 받은 적이 없고, 진짜 병목은 조립 clamp 이 소진되는
#   것(assembly_clamp)이었다.
samples:
