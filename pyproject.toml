    "pytest-asyncio>=1.1.0",
    "python-multipart>=0.0.20",
    "redis>=6.4.0",
    "sqlalchemy>=2.0.43",
    "tavily-python>=0.7.11",
    "uvicorn>=0.35.0",
    "aiofiles>=24.1.0",
    "trafilatura>=2.0.0",
    "pypdf2>=3.0.1",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "yfinance>=0.2.66",
    "python-dotenv>=1.1.1",
    "requests>=2.32.5",
    "boto3>=1.35.0",
    "playwright>=1.55.0",
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "pyjwt>=2.10.1",
    "google-auth>=2.35.0",
