[project]
name = "neos"
version = "0.23.0"
description = "NEOS: Intelligent Search and Analysis Agent Workflow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.122.0",
    "arize-phoenix>=5.5.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "greenlet>=3.2.4",
    "httpx>=0.28.1",
    "langchain==1.3.1",
    "langchain-anthropic==1.5.6",
    "langchain-community==0.4.1",
    "langchain-openai==1.6.2",
    "langgraph==1.2.11",
    "openai>=3.8.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-instrumentation>=0.65b0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "pandas>=2.3.2",
    "pgvector>=0.4.1",
    "psycopg2>=2.9.12",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.1.0",
    "python-multipart>=0.0.27",
    "redis>=6.4.0",
    "sqlalchemy>=2.0.51",
    "tavily-python>=0.7.26",
    "uvicorn>=0.35.0",
    "aiofiles>=25.1.0",
    "trafilatura>=2.2.0",
    "pypdf2>=3.0.1",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "yfinance>=0.2.66",
    "python-dotenv>=1.2.2",
    "requests>=2.33.0",
    "boto3>=1.35.0",
    "playwright>=1.61.0",
    "bcrypt>=5.0.0",
    "python-jose[cryptography]>=3.3.0",
    "pyjwt>=2.13.0",
    "google-auth>=2.58.0",
    "google-auth-oauthlib>=1.4.0",
    "google-generativeai>=0.8.6",
    "google-genai>=1.0.0",
    "langchain-google-genai>=2.0.0",
    "alembic>=1.18.4",
    "prometheus-client>=0.20.0",
    "psutil>=6.1.0",
    "celery>=5.4.0",
    "kombu>=5.6.2",
    "pybreaker>=1.4.1",
    "tiktoken>=0.5.0",
    "arxiv>=2.1.0",
    "wikipedia>=1.4.0",
    "xmltodict>=1.0.2",
    "pymupdf>=1.26.7",
    "pyyaml>=6.0.3",
    "granian[pname,uvloop]>=2.7.6",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-instrumentation-redis>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "graphviz>=0.21",
    "youtube-transcript-api>=0.6.2",
    "google-api-python-client>=2.198.0",
    "isodate>=0.7.2",
    "ray[default]>=2.57.0",
    "croniter>=2.0.0",
    "hiredis>=3.4.1",
    "discord-py>=2.7.1",
]

[project.optional-dependencies]
reranker = [
    "cohere>=5.0.0",
]
sandbox = [
    "RestrictedPython>=7.4",
]
channels = [
    "python-telegram-bot>=21.0",
    "discord.py>=2.3.0",
    "slack-bolt>=1.18.0",
]
ollama = [
    "langchain-ollama>=0.2.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.8",
    # 순서 의존을 실제로 시험하기 위해서다(S5 / CI #10). 이것이 없는 동안
    # pytest 는 수집 순서대로 돌았고, 그것은 "결정론적" 이지 "순서에
    # 의존하지 않는다" 가 아니다.
    "pytest-randomly>=4.1.0",
    # §7.4 멈춤(시드 7, 10시간 46분 무응답)을 사람이 아니라 pytest 가 잡게
    # 하기 위해서다. 컨트롤러가 .venv 에 2.4.0 을 이미 깔아뒀다 — 그 버전과
    # 호환되는 하한만 선언한다(옆의 pytest-randomly 처럼 상한은 두지 않는다).
    "pytest-timeout>=2.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["neos*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
