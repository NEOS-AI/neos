[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
asyncio_mode = auto
# 세션 전체를 하나의 이벤트 루프에서 돌린다. 테스트마다 루프를 새로 만들면
# DB 엔진도 테스트마다 재생성해야 하고, 버려진 asyncpg 커넥션이 닫힌 루프에
# 묶여 후반부에 커넥션 생성이 간헐적으로 실패한다.
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session

# 로그 설정
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 경고 필터
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Coverage 설정 (선택)
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --import-mode=importlib

# 마커 정의
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
    no_db: Tests that do not need database setup or cleanup
