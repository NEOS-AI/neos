[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
asyncio_mode = auto
# 세션 전체를 하나의 이벤트 루프에서 돌린다. 테스트마다 루프를 새로 만들면
# DB 엔진도 테스트마다 재생성해야 하고, 버려진 asyncpg 커넥션이 닫힌 루프에
# 묶여 후반부에 커넥션 생성이 간헐적으로 실패한다.
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session

# 로그 설정
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 경고 필터
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Coverage 설정 (선택)
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --import-mode=importlib

# 멈춤 감지 (§7.4). 전체 스위트가 시드 7 에서 사람이 10시간 46분 뒤에야
# 알아챌 만큼 조용히 멈춘 적이 있다 — pytest 는 멈춘 테스트를 세지 않고
# CI 는 타임아웃까지 초록도 빨강도 아닌 채로 매달린다.
#
# 이 값은 전체 스위트 실측 최댓값 기준이다 (no_db 부분집합의 평균으로
# 추정한 첫 버전은 DB 를 만지는 테스트의 꼬리를 재지 못해 틀렸다 —
# 평균은 꼬리를 보증하지 않는다). 전체 스위트를 돌려 확인했다:
#   .venv/bin/python -m pytest tests/ -q -p no:randomly --verbosity=-1 \
#     --durations=30 -p no:cacheprovider
#   → 1 failed, 3301 passed, 63 skipped in 123.11s
# 실패 1건은 `test_retry_with_strategy_exhausted` 가 진짜 지수 백오프로
# 31초를 실제로 자다가 30초 기본값에 걸린 것 — 아래에서 그 테스트 자체에
# 개별 오버라이드(`@pytest.mark.timeout(60)`)를 달아 해결했다(이유는 그
# 테스트 docstring 참고). 그 한 건을 뺀 나머지 3300여 개의 실측 최댓값은
# 6.5초대(subprocess 를 띄워 clean import 를 검증하는 두 테스트)이고, 그
# 다음은 5.34초 · 4.32초로 뚝 떨어진다. 이 테스트 하나 때문에 전역값을
# 올리면 나머지 전부에게 멈춤 감지가 그만큼 느려지므로, 전역은 30초로
# 두고(실측 최댓값 6.5초 대비 ~4.6배 여유) 예외 하나만 개별로 처리했다.
timeout = 30
# signal(SIGALRM)을 쓴다. §7.4 의 멈춤은 정확히 메인 스레드의
# threading.join() 이었다(TestClient 포털 스레드가 뜨기 전에 asyncio.
# create_task 가 Mock 으로 갈아치워져 join() 이 영원히 안 풀렸다) —
# 이건 메인 스레드 블로킹이므로 signal 로 잡힌다(실측: 아래 참고). thread
# 방식도 잡긴 하지만 워치독 스레드가 전체 스택을 덤프한 뒤 프로세스를
# 강제 종료한다 — pytest 가 정상적으로 "1 failed" 를 리포트하고 나머지
# 테스트를 이어가는 대신, 요약 없이 그 자리에서 세션이 끊긴다(실측
# 확인함). 이 저장소가 원하는 건 "그 테스트를 실패로 세고 계속 돈다"이지
# "죽이고 멈춘다"가 아니므로 signal 을 쓴다.
timeout_method = signal

# 마커 정의
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
    no_db: Tests that do not need database setup or cleanup
