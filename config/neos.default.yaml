environment: development

coding_model:
  enabled: false
  provider: anthropic
  model_timeout_sec: 120
  tool_timeout_sec: 30
  max_turns: 20
  max_tool_calls: 50
  max_consecutive_tool_errors: 3
  max_output_tokens: 8192
  max_transcript_bytes: 1048576
  max_cost_usd: 5.0
  input_cost_micros_per_million: 0
  output_cost_micros_per_million: 0
  command_enabled: true
  command_allowlist: [pytest, ruff, mypy, pnpm, git]
  mutation_snapshot_interval: 5

api:
  v1_prefix: /api/v1
  debug: false
  cors:
    allowed_origins:
      - http://localhost:3000
    allow_credentials: true
  gateway:
    enabled: false
    user_id_header: X-User-ID
    trusted_ips:
      - 127.0.0.1
      - ::1

database:
  pool_size: 20
  max_overflow: 30
  pool_timeout: 30
  pool_recycle: 1800

redis:
  ttl: 3600
  pool_size: 50
  min_idle_connections: 10

cache:
  workflow_response_ttl: 7200
  user_specific: false
  semantic:
    enabled: true
    threshold: 0.9

smart_cache:
  enabled: true
  similarity_threshold: 0.85
  max_entries: 100000
  statistics_enabled: true
  ttl:
    realtime: 900
    financial: 600
    analysis: 604800
    research: 2592000
    generation: 7776000

llm:
  provider: anthropic
  # model 미지정 = everyday 역할 기본값 (claude-sonnet-5). 고정하려면 문자열로 지정.
  temperature: 0.1
  timeout: 120
  research_planning_timeout: 180
  fast_model: claude-haiku-4-5-20251001
  prompt_caching:
    enabled: true
    ttl: 5m

  advisor:
    # 🔴 켜기 전에 이 모델이 `neos/config/models.yaml` 에 가격과 함께 있어야 한다.
    # advisor 호출은 `calculate_anthropic_cost` 를 거쳐 카탈로그에서 가격을 찾는데,
    # 없으면 §6 ③ 의 고장이 그대로 난다 -- 비용이 조용히 0 으로 집계된다.
    # 지금은 `enabled: false` 라 잠들어 있고, 켜면
    # `neos_llm_unpriced_calls_total{provider,model}` 이 그 사실을 알린다.
    enabled: false
    model: claude-opus-4-8
    max_uses: 2
    max_tokens: 2048
    max_pause_turns: 3
    prompt_caching:
      enabled: false
      ttl: 5m

embedding:
  provider: gemini
  model: gemini-embedding-2-flash
  dimension: 3072
  gemini_task_type: retrieval_document
  gemini_image_task_type: retrieval_document
  gemini_video_task_type: retrieval_document
  dataset:
    enabled: false
    sample_rate: 0.1
    dir: datasets/embeddings

vision:
  provider: auto
  enabled: true
  max_tokens: 1000
  image_detail: auto

agent:
  max_iterations: 10
  timeout: 300
  timeouts:
    knowledge_search: 20
    realtime_info_search: 30
    realtime_data_search: 30
    multi_query_search: 35
    web_lookup: 15
    data_analysis: 60
    comparative_analysis: 60
    web_content_analysis: 45
    image_generation: 120
    api_call: 30
    file_processing: 90
    task_creation: 30
    deep_research: 300
    hyper_deep_research: 600
    iterative_web_explorer: 180
    youtube_search: 45
  max_concurrent_workflows: 100
  max_concurrent_agents_per_workflow: 10
  stream_event_timeout: 2.0
  stream_heartbeat_interval: 30

iterative_explorer:
  max_depth: 5
  max_pages: 20
  max_iterations: 10
  min_quality: 0.75
  concurrent_fetches: 3
  timeout: 180
  tavily_timeout: 30
  cache_ttl: 3600
  completeness_cache_ttl: 1800
  initial_search_results: 10
  recent_results_window: 5
  page_limit_threshold: 0.9
  link_follower:
    max_links: 10
    min_relevance: 0.5

quality_evaluator:
  completeness_weight: 0.4
  credibility_weight: 0.3
  diversity_weight: 0.3
  early_termination_threshold: 0.3
  high_credibility_threshold: 0.7
  dominance_threshold: 0.5

workflow:
  search_orchestration_timeout: 40
  min_quality_score: 0.4
  max_retries: 2
  max_iterations: 10
  timeout_seconds: 300
  cache_enabled: true
  cache_ttl: 3600

research_harness:
  enabled: true
  allow_off: false
  default_mode: auto
  gate_threshold: 0.82
  advisory_threshold: 0.7
  high_risk_threshold: 0.9
  max_repair_attempts: 1
  hyper_deep_repair_attempts: 2
  model_checks:
    enabled: true
    timeout_seconds: 20
    max_claims: 8
    provider: ""
    model: ""
  persistence:
    persist_runs: false
    store_full_check_details: false
    evidence_storage_policy: summary_only
    cache_policy: passed_only
  direct_repair:
    enabled: false
    search_timeout_seconds: 25
    search_retries: 1

thinking_engine:
  enabled: true
  persist_traces: false
  persist_task_dag: false
  task_level_harness: true
  max_trace_text_length: 240

sources:
  reddit_user_agent: NEOS-Research-Engine/1.0
  sec_edgar_user_agent: NEOS-Research contact@neos.ai
  openalex_email: ""
  stock_api_provider: yahoo

youtube:
  max_results: 10
  transcript_languages:
    - en
    - ko
  min_relevance_score: 0.5
  enable_auto_captions: true
  max_transcript_length: 50000

auth:
  access_token_expire_minutes: 15
  refresh_token_expire_days: 7

session:
  cookie_name: neos_session
  expire_seconds: 604800

rate_limit:
  login_attempts: 5
  login_window_seconds: 600
  api_calls_per_minute: 100

circuit_breaker:
  enabled: true
  fail_threshold: 5
  recovery_timeout: 60
  expected_exception: true

observability:
  enabled: true
  log_level: INFO
  phoenix:
    host: localhost
    port: 6006
    collector_endpoint:
    project_name: neos-multi-agent
  metrics_enabled: true
  trace_enabled: true
  max_traces: 1000
  trace_retention_days: 30
  track_llm_calls: true
  track_agent_performance: true
  track_workflow_metrics: true

mcp:
  enabled: true
  server_host: localhost
  server_port: 8000
  timeout: 30
  retry_count: 3
  fallback_enabled: true
  tool_selection_strategy: mcp_fallback
  tool_quality_threshold: 0.7
  tool_performance_priority: false

dataset:
  auto_save: true
  save_format: jsonl
  base_path: datasets

web_search_logging:
  async_enabled: true
  queue_type: memory

storage:
  provider: local
  s3:
    bucket_name: neos-documents
    endpoint_url:
    region: us-east-1
  rustfs:
    bucket_name: neos-documents
    endpoint_url:
  local:
    path: storage/documents

checkpointer:
  type: postgres
  blob_threshold: 1048576
  s3:
    backend: s3
    bucket: neos-checkpoints
    region: us-east-1
    endpoint_url:

document_processing:
  max_file_size: 52428800
  chunk_size: 1000
  chunk_overlap: 200
  default_chunking_strategy: sentence
  semantic_chunk_threshold: 0.75

knowledge_graph:
  evidence_graph:
    enabled: false
  population:
    enabled: false
  max_traversal_depth: 2
  search_weight: 0.3
  extraction:
    enabled: true
    # model 미지정 = everyday 역할 기본값
  min_confidence: 0.7

deep_research:
  max_polling_duration: 4800
  poll_interval: 10
  default_quality_score: 0.85
  chunk_size: 200
  max_sources_in_memory: 50
  max_concurrent_requests: 3
  min_request_interval: 0.5
  token_budget: 150000

artifacts:
  enabled: true
  llm_model: claude-haiku-4-5-20251001
  llm_temperature: 0.7
  llm_max_tokens: 4096

chat:
  default_max_tokens: 200000
  enable_workflow: true
  enable_response_refinement: true
  history_enabled: true
  max_history_messages: 20
  history_context_max_tokens: 2000
  history_usage_level: full
  thinking_blocks_enabled: true
  max_thinking_length: 0
  disable_thinking_for_search: true
  token_budget: 80000

context_optimization:
  use_tiktoken: true
  token_counter_model: gpt-4
  overflow_detection: true
  window_threshold: 0.85
  max_context_tokens: 800000
  reserve_tokens: 4096
  tool_result_summarization: true
  tool_result_max_length: 4000
  # tool_result_summarization_model 미지정 = everyday 역할 기본값
  message_compression_enabled: true
  message_compression_threshold: 30
  message_compression_ratio: 0.5
  message_history_max_tokens: 50000
  semantic_deduplication: true
  semantic_similarity_threshold: 0.92
  workflow_context_budget: true
  default_workflow_token_budget: 100000

telemetry:
  otel:
    enabled: false
    exporter_jaeger_endpoint: http://localhost:4318/v1/traces
    service_name: neos-workflow
    service_version: 0.19.0
    deployment_environment: development
    traces_sampler: always_on
    traces_sampler_arg: 1.0
    bsp_max_queue_size: 2048
    bsp_schedule_delay: 5000
    bsp_max_export_batch_size: 512

celery:
  enabled: false
  task_serializer: json
  result_serializer: json
  timezone: UTC
  worker_prefetch_multiplier: 4
  task_acks_late: true

memory:
  short_term_ttl: 3600
  long_term_enabled: true
  episodic_enabled: true
  max_context_items: 10

query_classifier:
  use_llm: false
  llm_model: claude-haiku-4-5-20251001
  llm_timeout: 10

executive_summary:
  enabled: true
  min_words: 500
  max_sentences: 3

query_expansion:
  enabled: false
  variations: 3

cost_aware_routing:
  enabled: false
  default_budget: 5.0

citations:
  enabled: true
  default_style: numbered

fact_check:
  enabled: true
  complexity_threshold: 0.4

search_fallback:
  enabled: true
  duckduckgo_max_results: 10

tool_search:
  enabled: false
  top_k: 5
  max_rounds: 3
  rrf_k: 60

hybrid_search:
  alpha: 0.5
  candidate_count: 50

reranker:
  enabled: true
  top_n: 10
  model: rerank-english-v3.0

recursive_agent:
  enabled: false
  max_depth: 3
  max_tasks_per_level: 4
  complexity_threshold: 0.8
  atomizer_model: claude-haiku-4-5-20251001
  budget_cap: 0.5

hyper_deep_agent:
  enabled: false
  max_depth: 1
  max_tasks_per_level: 3
  complexity_threshold: 0.85
  budget_cap: 5.0
  task_level_harness_enabled: true

# 심층 분석 하네스 -- 검증된 클레임만 인용되는 검증형 분석 (D21에서 역할 재배치).
#
# 이 플래그는 **환경변수로 켤 수 없다.** `apply_legacy_env_overrides`는
# `loader.py`의 `LEGACY_ENV_KEYS` 허용목록에 있는 키만 적용하고, 목록에 없는
# 변수는 경고 없이 무시한다 -- `.env`에 DEEP_ANALYSIS_ENABLED=true를 써도
# 아무 일도 일어나지 않는다. recursive_agent / hyper_deep_agent / ray /
# a2ui / execution_approval도 같다. 전부 이 파일에서만 제어된다.
#
# 전제조건:
#   - PostgreSQL   원장과 이벤트 로그의 단일 상태 저장소
#   - TAVILY_API_KEY   discovery 단계의 web_search
#   - celery.enabled=true라면 **Redis 브로커가 반드시 떠 있어야 한다.**
#     submit_deep_analysis_job은 apply_async 실패 시 fallback이 없어
#     브로커가 없으면 job 제출이 그대로 실패한다.
deep_analysis:
  enabled: true
  models:
    # E3 해소 (2026-08-29). scout·dig·synth 는 `null` = 역할 기본값이고,
    # judge 만 명시한다.
    #
    # **왜 명시가 필요한가.** judge 와 scout 이 둘 다 `null` 이면 둘 다
    # `everyday` 로 해석돼 `claude-sonnet-5` 하나로 수렴한다 -- SCOUT 워커가
    # 만든 클레임을 **같은 모델**이 심사하는 자기 승인 편향 구조이고,
    # 설계 §6.5 가 명시적으로 금지한 것이다(로드맵 §2.3 의 타협 불가 항목).
    #
    # **judge 는 scout·dig·synth 셋 모두와 달라야 한다.** scout 만 보고
    # `claude-opus-5` 를 넣었다가 되돌렸다 -- dig·synth 가 이미 powerful 역할로
    # opus-5 라, 그러면 위반의 위치가 scout 에서 dig 로 옮겨갈 뿐이다.
    # (`test_manifest_records_the_configuration_that_produced_the_number` 가
    # 그것을 잡았다.)
    #
    # **왜 크로스 프로바이더인가.** Anthropic 카탈로그에서 셋 모두와 다르면서
    # 워커보다 약하지 않은 후보는 구형 opus 하나뿐이고 그것은 은퇴 예정이다.
    # 그리고 같은 가족은 실패 모드를 공유하므로 모델명만 다른 분리는 애초에
    # 약하다 -- 자기 승인 편향을 실제로 끊는 것은 다른 가족이다.
    #
    # 대가를 정확히: deep_analysis 가 OPENAI_API_KEY 에 의존하게 되고 장애 면이
    # 둘로 늘어난다. 키가 없으면 판정이 실패하지 조용히 통과하지 않는다.
    #
    # ⚠️ **이것은 표본 비교 경계다.** 판정자 모델이 바뀌면 #1~#21 과 채점
    # 결과를 직접 비교할 수 없다. 다음 사전 등록이 그 사실을 적어야 한다.
    judge: gpt-5.6-sol

ray:
  enabled: false
  address: auto
  num_cpus:
  object_store_memory: 2000000000

sandbox:
  enabled: false
  provider: memory
  lifecycle:
    create_timeout_sec: 30
    idle_timeout_sec: 900
    max_lifetime_sec: 14400
  resources:
    cpu_count: 1.0
    memory_bytes: 536870912
    pids: 128
    workspace_bytes: 1073741824
    tmpfs_bytes: 67108864
  execution:
    command_timeout_sec: 30
    max_output_bytes: 1048576
    max_stdin_bytes: 1048576
    allowed_env_names: [HOME, LANG, LC_ALL, PATH, TERM, TMPDIR]
  streams:
    pty_max_sessions: 4
    replay_events: 1024
    replay_bytes: 1048576
    watcher_debounce_sec: 0.05
  workspace:
    tree_max_entries: 5000
    file_max_bytes: 1048576
    diff_max_bytes: 2097152
    edit_batch_size: 20
    ticket_ttl_seconds: 30
    pty_idle_ttl_seconds: 1800
    pty_max_sessions: 3
  memory:
    root: .neos/sandboxes
  docker:
    image: ""
    network_mode: none
    user: "10001:10001"
    allow_unpinned_image: false
  managed:
    enabled: false
    shadow_admission: true
    global_kill_switch: false
    provider: fake
    region: local
    admission_reevaluation_seconds: 30
    reservation_lease_seconds: 60
    allocation_lease_seconds: 60
    cleanup_batch_size: 100
    cleanup_slo_seconds: 300
    health_window_size: 20
    degraded_failure_ratio: 0.25
    unavailable_failure_ratio: 0.5
    concurrent_quota: 3
    daily_allocation_quota: 50
    daily_active_seconds_quota: 43200
    archive_bytes_quota: 5368709120
    daily_cost_micros_quota: 10000000

contextual_retrieval:
  enabled: false
  model: claude-haiku-4-5-20251001
  max_tokens: 200
  max_concurrent: 3
  max_chunks_per_doc: 200
  budget_cap_usd: 0.1
  embed_source: contextual

execution_approval:
  enabled: false
  required_skills:
    - api_call
    - file_processing
    - task_creation
    - code_execution
  timeout_seconds: 60
  default_autonomy_level: 1

channels:
  telegram:
    enabled: false
  discord:
    enabled: false
  slack:
    enabled: false
  bot_user_id: ""

context_assembly:
  max_tokens: 8000
  short_term_ratio: 0.5
  long_term_ratio: 0.3
  episodic_ratio: 0.2

cron:
  enabled: true
  default_timezone: UTC
  max_tasks_per_user: 20
  llm_fallback_enabled: true
  llm_model: claude-haiku-4-5-20251001

model_providers:
  ollama:
    base_url: http://localhost:11434
    default_model: llama3.1:8b

a2ui:
  enabled: false
  llm_model: claude-haiku-4-5-20251001
  llm_provider: anthropic
  max_components: 10
  frame_timeout: 300

inline_visualization:
  enabled: true
