# 표본 #23 전용 오버레이 (DECISIONS D98 · D-14 = 분리).
#
#   NEOS_CONFIG_PATH=config/samples/sample-23.yaml .venv/bin/python scripts/deep_analysis_funnel_sample.py ...
#
# #23 은 CITE1 의 원인을 **BUDGET2 이전 코드로** 가른다. 고친 뒤에 원인을 물으면
# 무엇을 쟀는지 모른다(D96 §4). 이 한 줄 말고는 아무것도 바꾸지 않는다 -- 줄이
# 늘면 표본이 무엇을 쟀는지 다시 모르게 된다. 런 매니페스트가 이 값을 싣고,
# 판독기는 `--expect-budget2 off` 로 그것을 확인한다.
deep_analysis:
  budget_aware_reduction: false
