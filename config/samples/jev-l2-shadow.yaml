# L2 -- Jev 도구 위험 섀도 (로드맵 §12.12). 행동은 바꾸지 않고 기록만 한다.
#
#   NEOS_CONFIG_PATH=config/samples/jev-l2-shadow.yaml <앱 기동>
#   .venv/bin/python -m scripts.jev_l2_shadow_report --since <켠 날> --try 0.2:0.9
#
# 🔴 **아래 경계는 잠정값이고 게이트용이 아니다.** 섀도는 확률을 그대로 싣고 판독기가
# 후보 경계로 다시 밴딩하므로, 이 값은 원장의 `would_be_outcome` 표시에만 쓰인다.
# 출처: D-L2 비교 12 대상 × 3 (artifacts/jev-probe/20260923T102554Z-dl2-compare/)
# -- 무해한 군집은 두 질문 모두 ≤ 0.13, 명백한 파국(force push · DROP · 키 유출)은
# ≥ 0.94, 그 사이(rm -rf · reset --hard · 자격증명 읽기 · .env 쓰기)가 0.47~0.81.
# 이 파일로 `tool_risk_gate_enabled` 를 켜지 말 것 -- L3 은 불일치 건별 리뷰 뒤다.
#
# 호출마다 Jev 를 인라인으로 부른다(timeout_sec 5). 가격은 아직 모른다(L0 잔여).
# 개발 기동에만 쓴다 -- development.yaml 에 넣으면 CI 가 TypeSafe 키를 요구한다.
jev:
  enabled: true
  tool_risk_shadow_enabled: true
  model: jev-1.13.0
  question_thresholds:
    irreversible: {low_below: 0.2, high_at_or_above: 0.9}
    exfiltration: {low_below: 0.2, high_at_or_above: 0.9}
