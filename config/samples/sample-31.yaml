# 표본 #31 전용 오버레이 (DECISIONS D117). #30 과 바이트가 같은 설정이다 -- #30 은 크레딧 소진과
# 실행 중 문서 수정(영수증 dirty)으로 무효였다(D116).
#
#   NEOS_CONFIG_PATH=config/samples/sample-31.yaml .venv/bin/python scripts/deep_analysis_funnel_sample.py ...
#
# 비교 대상은 #29 하나다(compose 경로의 같은 설정). 조사 경로·BUDGET2·판정자(Jev)는 #24 이래 같다.
deep_analysis:
  budget_aware_reduction: true
  compose_child_enabled: true
  compose_max_turns: 12
jev:
  enabled: true
  model: jev-1.13.0
  judge_enabled: true
  judge_min_confidence: 0.60
