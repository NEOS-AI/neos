# Copy this file to config/neos.local.yaml for local non-secret runtime changes.
# Keep API keys, passwords, tokens, and credential-bearing URLs in .env or a
# NEOS_SECRETS_PATH dotenv file.
environment: development
coding_model:
  enabled: false
  provider: anthropic
  model_timeout_sec: 120
  tool_timeout_sec: 30
  max_turns: 20
  max_tool_calls: 50
  max_consecutive_tool_errors: 3
  max_output_tokens: 8192
  max_transcript_bytes: 1048576
  max_cost_usd: 5.0
  # Required and positive when enabled; set explicitly for the selected model.
  input_cost_micros_per_million: 0
  output_cost_micros_per_million: 0
  command_enabled: true
  command_allowlist: [pytest, ruff, mypy, pnpm, git]
  mutation_snapshot_interval: 5
api:
  debug: false
  cors:
    allowed_origins:
      - http://localhost:3000
llm:
  provider: anthropic
  model: claude-sonnet-5
  temperature: 0.7
  timeout: 180
  prompt_caching:
    enabled: true
    ttl: 5m

  advisor:
    enabled: false
    model: claude-opus-4-8
    max_uses: 2
    max_tokens: 2048
    max_pause_turns: 3
    prompt_caching:
      enabled: false
      ttl: 5m
embedding:
  provider: gemini
  model: gemini-embedding-2-flash
  dimension: 3072
research_harness:
  enabled: true
  default_mode: auto
  gate_threshold: 0.82
  direct_repair:
    enabled: false
sources:
  reddit_user_agent: NEOS-Research-Engine/1.0
  sec_edgar_user_agent: NEOS-Research contact@example.com
  openalex_email: ops@example.com
storage:
  provider: local
  local:
    path: storage/documents
telemetry:
  otel:
    enabled: false
