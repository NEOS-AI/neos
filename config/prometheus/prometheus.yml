# Prometheus Configuration for NEOS Enterprise
# Scrapes metrics from all services for monitoring and alerting

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'neos-production'
    environment: 'production'

# Alertmanager configuration (optional, add if using Alertmanager)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Load alert rules
rule_files:
  - "/etc/prometheus/alerts.yml"

# Scrape configurations
scrape_configs:
  # === NEOS Backend Services ===
  - job_name: 'neos-backend'
    scrape_interval: 10s
    static_configs:
      - targets:
          - 'neos-backend-1:8518'
          - 'neos-backend-2:8518'
          - 'neos-backend-3:8518'
    metrics_path: '/metrics'
    scheme: http

  # === PostgreSQL Database ===
  - job_name: 'postgres'
    scrape_interval: 30s
    static_configs:
      - targets:
          - 'postgres-exporter:9187'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'postgres-primary'

  # === Redis Cache ===
  - job_name: 'redis'
    scrape_interval: 30s
    static_configs:
      - targets:
          - 'redis-exporter:9121'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'redis-master'

  # === RabbitMQ Message Queue ===
  - job_name: 'rabbitmq'
    scrape_interval: 30s
    static_configs:
      - targets:
          - 'rabbitmq:15692'
    metrics_path: '/metrics'

  # === Prometheus Self-Monitoring ===
  - job_name: 'prometheus'
    scrape_interval: 30s
    static_configs:
      - targets:
          - 'localhost:9090'

  # === Grafana ===
  - job_name: 'grafana'
    scrape_interval: 30s
    static_configs:
      - targets:
          - 'grafana:3000'
    metrics_path: '/metrics'

  # === Ray 분산 처리 (Phase 4) ===
  # Ray Dashboard Prometheus 메트릭 엔드포인트
  # ray.init(_metrics_export_port=8080) 또는 ray start --metrics-export-port=8080 설정 필요
  # RAY_ENABLED=false 환경에서는 이 scrape 설정은 무해하게 실패함
  - job_name: 'ray-head'
    scrape_interval: 15s
    static_configs:
      - targets:
          - 'localhost:8080'  # Ray Head Node metrics export port
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'ray-head'
