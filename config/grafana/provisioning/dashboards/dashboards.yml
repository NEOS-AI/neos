# Grafana Dashboard Provisioning for NEOS Enterprise
apiVersion: 1

providers:
  - name: 'NEOS Dashboards'
    orgId: 1
    folder: 'NEOS'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
